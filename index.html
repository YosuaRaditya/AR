<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Aplikasi WebAR - Load Custom GLB</title>
  
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js CDN Standar Web 3D -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="app-container">

    <!-- Video Element Kamera HP (WebRTC Standar Universal) -->
    <video id="camera-feed" class="camera-stream" playsinline webkit-playsinline autoplay muted></video>

    <!-- Canvas Three.js untuk Render 3D & AR -->
    <canvas id="webgl-canvas"></canvas>

    <!-- Header Atas -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🌐</span>
        <h1>WebAR <span>Studio</span></h1>
      </div>

      <div class="header-actions">
        <!-- Input Upload GLB Custom -->
        <label for="glb-file-input" class="btn btn-primary" title="Upload GLB Sendiri">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span>Pilih GLB</span>
        </label>
        <input type="file" id="glb-file-input" accept=".glb,.gltf" hidden />

        <button id="btn-open-camera" class="btn btn-success">
          📷 Buka Kamera AR
        </button>
      </div>
    </header>

    <!-- Drag & Drop Overlay -->
    <div class="drop-overlay" id="drop-overlay">
      <div class="drop-message">
        <span class="drop-icon">📦</span>
        <p>Lepaskan file .GLB di sini</p>
      </div>
    </div>

    <!-- Badge Nama Model Aktif -->
    <div class="model-badge" id="model-badge">
      <span class="dot"></span>
      <span id="model-name">Astronaut (Model Bawaan)</span>
    </div>

    <!-- Toast Notifikasi -->
    <div id="toast" class="toast"></div>

    <!-- Loading Spinner -->
    <div id="loading" class="loading-overlay hidden">
      <div class="spinner"></div>
      <span id="loading-text">Memuat model 3D...</span>
    </div>

    <!-- Reticle / Cincin Bidik Penanda Posisi AR (Tampil saat kamera aktif) -->
    <div id="ar-reticle" class="ar-reticle hidden">
      <div class="reticle-ring">
        <div class="reticle-center-dot"></div>
      </div>
      <span class="reticle-guide">Ketuk layar di sini untuk menempatkan 3D</span>
    </div>

    <!-- Petunjuk Atas saat Kamera Aktif -->
    <div id="ar-instruction-bar" class="ar-instruction-bar hidden">
      <span id="ar-instruction-icon">📍</span>
      <span id="ar-instruction-text">Arahkan kamera & ketuk layar untuk menempatkan model</span>
    </div>

    <!-- Kontrol Bawah AR (Saat Kamera Aktif) -->
    <div id="ar-controls-bar" class="ar-controls-bar hidden">
      <button id="btn-reposition" class="btn btn-secondary">
        📍 Pindah Posisi
      </button>
      <button id="btn-close-camera" class="btn btn-danger">
        ✕ Tutup Kamera
      </button>
    </div>

    <!-- Panel Kontrol Mode Preview Biasa (Sebelum Kamera Aktif) -->
    <div class="floating-panel" id="preview-panel">
      <div class="panel-card">
        <div class="panel-row">
          <button id="btn-rotate" class="btn btn-secondary active">🔄 Putar</button>
          <button id="btn-reset" class="btn btn-secondary">🎯 Reset</button>
          <select id="preset-select" class="dropdown">
            <option value="https://modelviewer.dev/shared-assets/models/Astronaut.glb">Astronaut</option>
            <option value="https://modelviewer.dev/shared-assets/models/RobotExpressive.glb">Robot</option>
            <option value="https://modelviewer.dev/shared-assets/models/Chair.glb">Kursi Modern</option>
            <option value="https://modelviewer.dev/shared-assets/models/shishkebab.glb">Makanan 3D</option>
          </select>
        </div>
        <div class="panel-row slider-row">
          <label for="scale-range">Ukuran Model:</label>
          <input type="range" id="scale-range" min="0.2" max="3" step="0.1" value="1" />
          <span id="scale-label">1.0x</span>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
